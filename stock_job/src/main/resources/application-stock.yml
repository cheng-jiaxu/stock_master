# 配置股票相关的参数
stock:
  inner: # 国内大盘ID
    - sh000001 # 上证ID
    - sz399001 #  深证ID
  outer: # 外盘ID
    - int_dji # 道琼斯
    - int_nasdaq # 纳斯达克
    - int_hangseng # 恒生
    - int_nikkei # 日经指数
    - b_TWSE # 台湾加权
    - b_FSSTI # 新加坡
  marketUrl: https://hq.sinajs.cn/list=
  blockUrl: http://vip.stock.finance.sina.com.cn/q/view/newSinaHy.php
xxl:
  job:
    admin:
      addresses: http://172.16.39.131:8093/
      accessToken: default_token
      timeout: 3
    executor:
      enabled: true
      appname: stock-job-executor
      address:
      ip: 172.16.39.1
      port: 9999
      logpath: .\logs
      logretentiondays: 30
      excludedpackage:
task:
  pool:
    corePoolSize: 5 #核心线程数
    maxPoolSize: 20 #设置最大线程数
    keepAliveSeconds: 300 #设置线程活跃时间,单位秒
    queueCapacity: 100 #设置队列容量